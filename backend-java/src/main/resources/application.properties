spring.application.name=kneesense-backend
server.port=${SERVER_PORT:8080}

# Do not expose exception messages or stack traces to HTTP clients.
server.error.include-message=never
server.error.include-stacktrace=never

# MySQL. Credentials are supplied only through the local environment.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/${MYSQL_DATABASE:kneesense}
spring.datasource.username=${MYSQL_USER:kneesense_app}
spring.datasource.password=${MYSQL_PASSWORD}

# The SQL schema is managed explicitly; Hibernate must never create or alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT secret must contain at least 32 UTF-8 bytes. Never commit its value.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-ms=${JWT_EXPIRATION_MS:43200000}
app.auth.cookie-name=${AUTH_COOKIE_NAME:KNEESENSE_AUTH}
app.auth.cookie-secure=${COOKIE_SECURE:false}

# Initial administrator bootstrap. Keep both values in ignored local environment files.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


# X-ray uploads are handled in memory and are never written to disk.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.file-size-threshold=5MB
spring.servlet.multipart.max-request-size=6MB

# Start with the deterministic mock. Switch to http only after ML-service handoff.
app.ml.mode=${ML_CLIENT_MODE:mock}
app.ml.timeout-ms=${ML_TIMEOUT_MS:90000}
app.ml.mock.error-code=${ML_MOCK_ERROR_CODE:}
app.ml.mock.source=${ML_MOCK_SOURCE:cached}

# In-memory rate limits. Tune through environment variables when deploying.
app.rate-limit.assessment.capacity=${ASSESSMENT_LIVE_REPORT_LIMIT:10}
app.rate-limit.assessment.refill-period=${ASSESSMENT_LIVE_REPORT_PERIOD:PT24H}
app.rate-limit.login.capacity=${LOGIN_ATTEMPT_LIMIT:5}
app.rate-limit.login.refill-period=${LOGIN_ATTEMPT_PERIOD:PT1M}